name: Bug report
description: Something in BieberKit does not work as the documentation says.
labels: [bug, needs-triage]
body:
  - type: input
    id: version
    attributes:
      label: BieberKit version
      description: Output of `pnpm bieberkit --version`.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [PostgreSQL, MySQL, SQLite, Not related]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest steps or repository that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Include the error code (for example HDR003 or LAY002) if there is one. Remove secrets.
      render: text
