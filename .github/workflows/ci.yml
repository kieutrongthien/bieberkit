name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. This workflow never publishes and never receives id-token (SEC-16, SEC-21).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node.js 26 LTS is the default. Node.js 24 stays until its end of life on 2028-04-30.
        node: [26, 24]
    steps:
      # SEC-13: Renovate (helpers:pinGitHubActionDigests) pins these to commit SHAs.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/setup@v1
        with:
          runtime: node@${{ matrix.node }}
          cache: true

      # SEC-12: frozen lockfile, dependency build scripts blocked unless allowlisted.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
