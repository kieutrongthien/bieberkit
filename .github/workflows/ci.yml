# Pull request and main checks. Release is a separate workflow (release.yml).
# Every third-party action is pinned by commit SHA with its tag in a comment (SEC-13). Renovate keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. This workflow never publishes and never receives id-token (SEC-16, SEC-21).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node.js 26 LTS is the default. Node.js 24 stays until its end of life on 2028-04-30.
        node: [26, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install: false, because the action's own install is not the frozen one below (SEC-12).
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      # SEC-12: frozen lockfile, dependency build scripts blocked unless allowlisted.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  packages:
    name: Packages and API report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The committed API reports must match the build (spec 22.3, step 4).
      - run: pnpm check:api
      # Pack every package and run publint and attw (esm-only profile) on the tarballs (ADR 0014).
      - run: pnpm check:packages

  changeset:
    name: Changeset for API changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: false
          install: false
      # An existing API report that changed needs a changeset. The tool reads only git and Node.js built-ins.
      - name: Require a changeset when an API report changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node tools/api-report.ts --changeset-since "origin/$BASE_REF"

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The linters are containers pinned by digest, so no third-party action is added to this workflow (ADR 0014).
      # rhysd/actionlint 1.7.12
      - name: actionlint
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color=false .github/workflows/*.yml
      # zizmor 1.32.0. Offline audits only, so it needs no token.
      - name: zizmor
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          ghcr.io/zizmorcore/zizmor@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
          --no-online-audits --persona pedantic --format plain .github/workflows

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The tests that need servers (spec 9.1, section 21): PostgreSQL, MySQL, a Valkey for the cache and one for the queue, and an S3 server.
    # tools/test-services.sh starts them as containers pinned by digest, tuned for speed, with credentials that exist only in this job.
    # The whole suite then runs on Node.js 26 with BK_REQUIRE_DIALECTS=all, so a missing service fails the run, and with the coverage
    # thresholds of TST-01, so a threshold that is not met fails the build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          runtime: node@26
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Start the services
        run: sh tools/test-services.sh start

      - name: The variables that the tests read
        run: sh tools/test-services.sh env >> "$GITHUB_ENV"

      - run: pnpm test:coverage

      - name: The logs of the services, when a test failed
        if: failure()
        run: |
          for name in bk-test-pg bk-test-mysql bk-test-valkey bk-test-queue-valkey bk-test-s3; do
            echo "::group::$name"
            docker logs --tail 80 "$name" || true
            echo "::endgroup::"
          done
