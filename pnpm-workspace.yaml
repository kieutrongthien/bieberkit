packages:
  - 'packages/*'
  - 'plugins/*'
  - 'templates/*'
  - 'examples/*'

# Supply chain (SEC-11). Do not relax these to make an install pass. Report the failure instead.

# New versions become installable 7 days after publication. No blanket exclusion, not even
# for @bieberkit/*. A security fast path adds the exact fixed version here and removes it
# after 7 days, for example:
#   minimumReleaseAgeExclude:
#     - better-auth@1.7.17
minimumReleaseAge: 10080

# Refuse a version whose publishing trust (provenance, trusted publisher) is weaker than an
# earlier version of the same package.
trustPolicy: no-downgrade

# Only direct dependencies may come from git repositories or tarball URLs.
blockExoticSubdeps: true

# Dependency build scripts run only when listed here with true. Anything unlisted fails the
# install (strictDepBuilds). Each entry needs a reason in the pull request that adds it.
strictDepBuilds: true
allowBuilds: {}

# Exact versions in package.json. The lockfile is the record of what runs.
saveExact: true
